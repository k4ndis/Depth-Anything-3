# The hooks from .pre-commit-config.yaml now run even when nobody has run
# `pre-commit install`.
#
# Deliberately NOT --all-files: this is a fork, and the upstream state is not
# clean (as of session 13: 149 flake8 findings, 26 files black would
# reformat). A job that is red from day one and stays red gets ignored after a
# week - at which point it may as well not exist.
#
# So what gets checked is only what this branch actually touches relative to
# the base branch. The inherited state is left alone, while our own changes
# keep to black, isort and flake8. Whoever wants to format the whole fork
# later does that in a commit of its own and then switches this over to
# --all-files.
name: pre-commit

# Pull requests only, and here - unlike in the other two repos - NOT
# additionally on a push to main.
#
# The reason lies in what this job checks: the files a branch changes relative
# to the base branch. On main against main there are none - the run would
# always be green without having looked at anything. A checkmark that means
# nothing is worse than no checkmark: it looks like a promise.
#
# A push to a branch without a PR therefore triggers nothing. Anyone who wants
# to see green before that opens the PR as a draft - or runs the hooks
# locally, which is what they are for: `pre-commit install`.
on:
  pull_request:

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    env:
      BASE: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: without it there is no common ancestor against which
          # "changed" could be determined at all.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install pre-commit

      - name: Run hooks on the changed files
        run: |
          git fetch --no-tags origin "$BASE"
          pre-commit run \
            --from-ref "origin/$BASE" \
            --to-ref HEAD \
            --show-diff-on-failure
