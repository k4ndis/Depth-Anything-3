<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.163.0/build/three.module.js",

<script type="module">
import * as THREE        from 'three';
import { GLTFLoader }    from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import {
  forward, inverse, PAN_HOME_DEG, TILT_HOME_DEG,
  RIG_TESTMODELL, RIG_PILOTMODELL,
} from './rig-kinematics.js';

const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const scene  = new THREE.Scene();
scene.background = new THREE.Color(0x080810);
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.001, 1000);
camera.position.set(0, 1, 3);

const orbitCtrl = new OrbitControls(camera, renderer.domElement);
orbitCtrl.enableDamping = true; orbitCtrl.dampingFactor = 0.06;
orbitCtrl.panSpeed = 0.7; orbitCtrl.zoomSpeed = 1.1;
orbitCtrl.rotateSpeed = 0.6; orbitCtrl.screenSpacePanning = true;

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const ovBar        = document.getElementById('ov-bar');
const ovStatus     = document.getElementById('ov-status');
const overlay      = document.getElementById('overlay');
const infoScene    = document.getElementById('info-scene');
const infoCam      = document.getElementById('info-cam');
const targetInfo   = document.getElementById('target-info');
const btnSend      = document.getElementById('btn-send');
const manualHint   = document.getElementById('manual-hint');
const clickRing    = document.getElementById('click-ring');
const controlsEl   = document.getElementById('controls');
const settingsEl   = document.getElementById('settings');
const alignStatusEl = document.getElementById('alignment-status');

const allPoints    = [];
const homePos      = { cam: new THREE.Vector3(), tgt: new THREE.Vector3() };
let camMarker      = null;
let camWorldPos    = null;
let rigConfig      = RIG_TESTMODELL;
let rigAlignment   = null;  // { rotateY(), rigToScene(), sceneToRig() } – siehe fitRigAlignment()
let lastTargetPt   = null;
let lastPanTilt    = null;
let headingRayLine = null;

function loadSettings() {
  document.getElementById('sb-url').value    = localStorage.getItem('neptun_sb_url')    ?? '';
  document.getElementById('sb-key').value    = localStorage.getItem('neptun_sb_key')    ?? '';
  document.getElementById('sb-device').value = localStorage.getItem('neptun_sb_device') ?? '';
}

document.getElementById('btn-sb-save').addEventListener('click', () => {
  localStorage.setItem('neptun_sb_url',    document.getElementById('sb-url').value.trim());
  localStorage.setItem('neptun_sb_key',    document.getElementById('sb-key').value.trim());
  localStorage.setItem('neptun_sb_device', document.getElementById('sb-device').value.trim());
  settingsEl.style.display = 'none';
  refreshSendBtn();
});
document.getElementById('btn-settings').addEventListener('click', () => {
  settingsEl.style.display = settingsEl.style.display === 'none' ? 'block' : 'none';
});

function buildCamMarker() {
  const g = new THREE.Group();
  g.add(new THREE.Mesh(
    new THREE.SphereGeometry(0.05, 12, 12),
    new THREE.MeshBasicMaterial({ color: 0x00ffcc })
  ));
  const post = new THREE.Mesh(
    new THREE.CylinderGeometry(0.008, 0.008, 0.12, 8),
    new THREE.MeshBasicMaterial({ color: 0x00aa88 })
  );
  post.position.y = -0.06; g.add(post);
  return g;
}

// Fittet die Starrkörper-Transformation (Rotation um +Y + Translation)
// zwischen dem Rig-Referenzsystem (rig_kinematics.forward()) und dem
// DA3-Rekonstruktionsframe (beliebig orientiert, aber maßstabsgetreu).
// Ersetzt den früheren manuellen headingDeg-Slider vollständig.
function fitRigAlignment(scanCams, metaFrames, config) {
  const n = Math.min(scanCams.length, metaFrames.length);
  if (!n) return null;

  const rigPoses = [];
  let sinSum = 0, cosSum = 0;
  for (let i = 0; i < n; i++) {
    const { position, orientation } = forward(metaFrames[i].pan_deg, metaFrames[i].tilt_deg, config, 'single');
    rigPoses.push(position);
    const observedYaw = Math.atan2(scanCams[i].fwd.x, scanCams[i].fwd.z);
    const rigYaw = orientation.yawDeg * Math.PI / 180;
    const delta = observedYaw - rigYaw;
    sinSum += Math.sin(delta); cosSum += Math.cos(delta);
  }
  const yawRad = Math.atan2(sinSum / n, cosSum / n);
  const cosA = Math.cos(yawRad), sinA = Math.sin(yawRad);

  const rotateY = (p) => ({
    x: p.x * cosA + p.z * sinA,
    y: p.y,
    z: -p.x * sinA + p.z * cosA,
  });

  let tx = 0, ty = 0, tz = 0;
  for (let i = 0; i < n; i++) {
    const r = rotateY(rigPoses[i]);
    tx += scanCams[i].pos.x - r.x;
    ty += scanCams[i].pos.y - r.y;
    tz += scanCams[i].pos.z - r.z;
  }
  tx /= n; ty /= n; tz /= n;

  return {
    yawDeg: yawRad * 180 / Math.PI,
    rigToScene(p) {
      const r = rotateY(p);
      return new THREE.Vector3(r.x + tx, r.y + ty, r.z + tz);
    },
    rigDirectionToScene(d) {
      const r = rotateY(d);
      return new THREE.Vector3(r.x, r.y, r.z);
    },
    sceneToRig(p) {
      const rx = p.x - tx, ry = p.y - ty, rz = p.z - tz;
      return { x: rx * cosA - rz * sinA, y: ry, z: rx * sinA + rz * cosA };
    },
  };
}

function updateAlignmentRay() {
  if (headingRayLine) {
    scene.remove(headingRayLine);
    headingRayLine.geometry.dispose();
    headingRayLine = null;
  }
  if (camWorldPos && rigAlignment) {
    const { orientation } = forward(PAN_HOME_DEG, TILT_HOME_DEG, rigConfig, 'single');
    const dir = rigAlignment.rigDirectionToScene({ x: orientation.dx, y: orientation.dy, z: orientation.dz });
    const pts = [camWorldPos.clone(), camWorldPos.clone().addScaledVector(dir, 4.0)];
    headingRayLine = new THREE.Line(
      new THREE.BufferGeometry().setFromPoints(pts),
      new THREE.LineBasicMaterial({ color: 0xffdd00, transparent: true, opacity: 0.45 })
    );
    scene.add(headingRayLine);
  }
}

function placeCamAt(pos, source = 'auto') {
  if (!camMarker) { camMarker = buildCamMarker(); scene.add(camMarker); }
  camMarker.position.copy(pos);
  camWorldPos = pos.clone();
  updateAlignmentRay();
  const metaBadge = source === 'rig_kinematics'
    ? '<span id="auto-badge" style="background:rgba(0,150,255,.15);border-color:rgba(0,150,255,.3);color:#7af">🗺 rig_kinematics</span>'
    : '<span id="auto-badge" style="background:rgba(255,160,0,.15);border-color:rgba(255,160,0,.3);color:#fb8">⚠ unkalibriert</span>';
  infoCam.innerHTML =
    `📍 ${metaBadge} <b>${pos.x.toFixed(2)}, ${pos.y.toFixed(2)}, ${pos.z.toFixed(2)}</b>`;
  infoCam.style.display = 'block';
  if (lastTargetPt) displayPanTilt(lastTargetPt);
}

// Zielt die Referenzkamera physikalisch fundiert auf tgtScenePos aus:
// Zielpunkt aus dem DA3-Szenenframe ins Rig-Referenzsystem transformieren,
// dort rig_kinematics.inverse() lösen lassen. Ersetzt die alte
// headingDeg-Näherung (die axis_offset_mm ignorierte).
function computePanTilt(tgtScenePos) {
  if (!rigAlignment || !camWorldPos) return null;
  const dist = camWorldPos.distanceTo(tgtScenePos);
  if (dist < 0.001) return null;

  const rigTarget = rigAlignment.sceneToRig(tgtScenePos);
  let panDeg, tiltDeg;
  try {
    ({ panDeg, tiltDeg } = inverse(rigTarget, rigConfig));
  } catch {
    return null;
  }

  const [panMin, panMax]   = rigConfig.panRangeDeg;
  const [tiltMin, tiltMax] = rigConfig.tiltRangeDeg;
  const ok = panDeg >= panMin && panDeg <= panMax && tiltDeg >= tiltMin && tiltDeg <= tiltMax;
  const pan  = Math.round(Math.max(panMin,  Math.min(panMax,  panDeg))  * 10) / 10;
  const tilt = Math.round(Math.max(tiltMin, Math.min(tiltMax, tiltDeg)) * 10) / 10;
  return { pan, tilt, dist: Math.round(dist * 100) / 100, ok };
}

function displayPanTilt(pt) {
  if (!camWorldPos) return;
  lastTargetPt = pt;
  lastPanTilt  = computePanTilt(pt);
  const box = document.getElementById('target-box');
  if (!lastPanTilt) {
    if (!rigAlignment) {
      targetInfo.innerHTML = '<span style="color:#f76">⚠ Keine Rig-Ausrichtung (scan_metadata.json fehlt oder unvollständig)</span>';
      box.style.display = 'block';
    }
    return;
  }
  const { pan, tilt, dist, ok } = lastPanTilt;
  targetInfo.innerHTML =
    `Pan:  <b>${pan.toFixed(1)}°</b><br>` +
    `Tilt: <b>${tilt.toFixed(1)}°</b><br>` +
    `Dist: <b>${dist} m</b><br>` +
    (ok ? '<span style="color:#4fc">✓ Im Servo-Bereich</span>'
        : '<span style="color:#f76">⚠ Servo-Limit überschritten</span>');
  box.style.display = 'block';
  refreshSendBtn();
}

function refreshSendBtn() {
  const hasSb = !!(localStorage.getItem('neptun_sb_url') && localStorage.getItem('neptun_sb_device'));
  btnSend.disabled = !(hasSb && lastPanTilt);
  manualHint.style.display = hasSb ? 'block' : 'none';
}

btnSend.addEventListener('click', async () => {
  if (!lastPanTilt) return;
  const url    = localStorage.getItem('neptun_sb_url');
  const key    = localStorage.getItem('neptun_sb_key');
  const device = localStorage.getItem('neptun_sb_device');
  if (!url || !key || !device) return;
  btnSend.disabled = true; btnSend.textContent = '…';
  try {
    const r = await fetch(`${url}/rest/v1/devices?id=eq.${encodeURIComponent(device)}`, {
      method: 'PATCH',
      headers: { 'apikey': key, 'Authorization': `Bearer ${key}`,
                 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
      body: JSON.stringify({
        manual_pan_target:  lastPanTilt.pan,
        manual_tilt_target: lastPanTilt.tilt,
        manual_move_token:  crypto.randomUUID(),
      }),
    });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    btnSend.textContent = '✓ Gesendet!';
    btnSend.style.borderColor = 'rgba(80,255,150,.6)';
  } catch (e) {
    btnSend.textContent = `✗ ${e.message}`;
    btnSend.style.borderColor = 'rgba(255,80,80,.6)';
    console.error('NEPTUN send:', e);
  }
  setTimeout(() => {
    btnSend.textContent = '→ An NEPTUN senden';
    btnSend.style.borderColor = '';
    refreshSendBtn();
  }, 2500);
});

function _frustumApex(node) {
  const pos = node.geometry.attributes.position;
  const idx = node.geometry.index;
  if (!pos || pos.count < 4) return null;
  if (idx) {
    const usage = new Uint32Array(pos.count);
    for (let i = 0; i < idx.count; i++) usage[idx.array[i]]++;
    let maxU = 0, cwI = 0;
    for (let i = 0; i < usage.length; i++) { if (usage[i] > maxU) { maxU = usage[i]; cwI = i; } }
    if (maxU < 3) return null;
    return new THREE.Vector3(pos.getX(cwI), pos.getY(cwI), pos.getZ(cwI))
      .applyMatrix4(node.matrixWorld);
  } else {
    const verts = [];
    for (let i = 0; i < pos.count; i++)
      verts.push(new THREE.Vector3(pos.getX(i), pos.getY(i), pos.getZ(i))
        .applyMatrix4(node.matrixWorld));
    const T = 0.001;
    let best = null, bestN = 0;
    for (const v of verts) {
      const close = verts.filter(u => v.distanceTo(u) < T);
      if (close.length > bestN) {
        bestN = close.length;
        const sum = new THREE.Vector3();
        close.forEach(u => sum.add(u));
        best = sum.divideScalar(close.length);
      }
    }
    return bestN >= 3 ? best : null;
  }
}

function _frustumFwd(node, apex) {
  const pos = node.geometry.attributes.position;
  const T   = 0.001;
  const cc  = new THREE.Vector3();
  let n     = 0;
  for (let i = 0; i < pos.count; i++) {
    const v = new THREE.Vector3(pos.getX(i), pos.getY(i), pos.getZ(i))
      .applyMatrix4(node.matrixWorld);
    if (v.distanceTo(apex) > T) { cc.add(v); n++; }
  }
  if (!n) return null;
  cc.divideScalar(n);
  const fwd = new THREE.Vector3().subVectors(cc, apex);
  return fwd.length() > 0.001 ? fwd.normalize() : null;
}

const metaPromise = fetch('scan_metadata.json')
  .then(r => r.ok ? r.json() : null)
  .catch(() => null);

const loader = new GLTFLoader();
loader.load(
  'scene.glb',
  async (gltf) => {
    ovStatus.textContent = 'Verarbeite Geometrie …';
    const positions = [], colors = [];
    gltf.scene.updateMatrixWorld(true);

    const scanMeta = await metaPromise;
    if (scanMeta) {
      console.log(`[DA3] scan_metadata.json: ${scanMeta.frame_count} Frames`);
      rigConfig = scanMeta.rig === 'pilotmodell' ? RIG_PILOTMODELL : RIG_TESTMODELL;
    } else {
      console.log('[DA3] scan_metadata.json nicht gefunden – keine Rig-Ausrichtung möglich');
    }

    const scanCams = [];

    gltf.scene.traverse(node => {
      if (!node.isCamera) return;
      const pos = new THREE.Vector3(), quat = new THREE.Quaternion();
      node.getWorldPosition(pos); node.getWorldQuaternion(quat);
      const fwd = new THREE.Vector3(0, 0, -1).applyQuaternion(quat);
      scanCams.push({ pos, fwd });
    });

    if (scanCams.length === 0 && (gltf.parser.json.cameras?.length ?? 0) > 0) {
      const json = gltf.parser.json;
      const threeByNodeIdx = new Map();
      gltf.scene.traverse(obj => {
        const a = gltf.parser.associations?.get(obj);
        if (a?.nodes !== undefined) threeByNodeIdx.set(a.nodes, obj);
      });
      (json.nodes || []).forEach((rn, ni) => {
        if (rn.camera === undefined) return;
        const obj = threeByNodeIdx.get(ni);
        if (!obj) return;
        const pos = new THREE.Vector3(), quat = new THREE.Quaternion();
        obj.getWorldPosition(pos); obj.getWorldQuaternion(quat);
        const fwd = new THREE.Vector3(0, 0, -1).applyQuaternion(quat);
        scanCams.push({ pos, fwd });
      });
    }

    if (scanCams.length === 0) {
      const frustumNodes = [];
      gltf.scene.traverse(node => {
        if (!node.isLine) return;
        node.updateWorldMatrix(true, false);
        if (!node.geometry?.attributes?.position) return;
        const cnt = node.geometry.attributes.position.count;
        if (cnt < 4 || cnt > 64) return;
        const box = new THREE.Box3().setFromObject(node);
        const sz  = box.getSize(new THREE.Vector3());
        const mx  = Math.max(sz.x, sz.y, sz.z);
        if (mx < 0.005 || mx > 5.0) return;
        frustumNodes.push(node);
      });
      console.log(`[DA3] Method 3: ${frustumNodes.length} Line-Kandidaten`);
      for (const node of frustumNodes) {
        const apex = _frustumApex(node);
        if (!apex) continue;
        const fwd = _frustumFwd(node, apex);
        if (fwd) scanCams.push({ pos: apex, fwd });
      }
    }

    console.log(`[DA3] ${scanCams.length} Scan-Kamera(s) erkannt`);

    gltf.scene.traverse(node => {
      if (node.isPoints) {
        const c = node.clone(); scene.add(c); allPoints.push(c); return;
      }
      if (!node.isMesh) return;
      const geo = node.geometry.clone();
      geo.applyMatrix4(node.matrixWorld);
      const posA = geo.attributes.position, colA = geo.attributes.color;
      const mat  = node.material;
      for (let i = 0; i < posA.count; i++) {
        positions.push(posA.getX(i), posA.getY(i), posA.getZ(i));
        if (colA) { colors.push(colA.getX(i), colA.getY(i), colA.getZ(i)); }
        else { const c=(Array.isArray(mat)?mat[0]:mat)?.color??new THREE.Color(0x8899cc); colors.push(c.r,c.g,c.b); }
      }
      geo.dispose();
    });

    if (positions.length > 0) {
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      const hc = colors.length === positions.length;
      if (hc) geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
      const pts = new THREE.Points(geo, new THREE.PointsMaterial({
        size: 0.007, sizeAttenuation: true, vertexColors: hc,
        color: hc ? 0xffffff : 0x88aadd, transparent: true, opacity: 0.92,
      }));
      scene.add(pts); allPoints.push(pts);
    }

    if (!allPoints.length) {
      ovStatus.textContent = 'Keine Geometrie gefunden.';
      ovStatus.style.color = '#f66'; return;
    }

    const box  = new THREE.Box3().setFromObject(scene);
    const ctr  = box.getCenter(new THREE.Vector3());
    const size = box.getSize(new THREE.Vector3());
    const mx   = Math.max(size.x, size.y, size.z);
    orbitCtrl.target.copy(ctr);
    camera.position.set(ctr.x, ctr.y + size.y * 0.25, ctr.z + mx * 1.5);
    camera.near = mx * 0.00005; camera.far = mx * 20;
    camera.updateProjectionMatrix(); orbitCtrl.update();
    homePos.cam.copy(camera.position); homePos.tgt.copy(ctr);

    if (scanCams.length > 0) {
      const avgPos = new THREE.Vector3();
      scanCams.forEach(c => avgPos.add(c.pos));
      avgPos.divideScalar(scanCams.length);

      let camSource = 'auto';
      let markerPos = avgPos;

      if (scanMeta?.frames) {
        rigAlignment = fitRigAlignment(scanCams, scanMeta.frames, rigConfig);
        if (rigAlignment) {
          const { position: homeRigPos } = forward(PAN_HOME_DEG, TILT_HOME_DEG, rigConfig, 'single');
          markerPos = rigAlignment.rigToScene(homeRigPos);
          camSource = 'rig_kinematics';
          alignStatusEl.innerHTML = `✓ yaw=${rigAlignment.yawDeg.toFixed(1)}°`;
          console.log(`[DA3] Rig-Ausrichtung: yaw=${rigAlignment.yawDeg.toFixed(1)}° (aus ${Math.min(scanCams.length, scanMeta.frames.length)} Frames, rig=${rigConfig === RIG_PILOTMODELL ? 'pilotmodell' : 'testmodell'})`);
        } else {
          alignStatusEl.innerHTML = '<span style="color:#f76">fehlgeschlagen</span>';
        }
      } else {
        alignStatusEl.innerHTML = '<span style="color:#f76">scan_metadata.json fehlt</span>';
      }

      placeCamAt(markerPos, camSource);

      const n = scanCams.length;
      scanCams.forEach((c, i) => {
        const col = new THREE.Color().setHSL(i / n, 1, 0.65);
        const dot = new THREE.Mesh(
          new THREE.SphereGeometry(0.018, 8, 8),
          new THREE.MeshBasicMaterial({ color: col })
        );
        dot.position.copy(c.pos); scene.add(dot);
        const pts2 = [c.pos.clone(), c.pos.clone().addScaledVector(c.fwd, 0.12)];
        scene.add(new THREE.Line(
          new THREE.BufferGeometry().setFromPoints(pts2),
          new THREE.LineBasicMaterial({ color: col })
        ));
      });
    }

    const ptCount = allPoints.reduce((s,p) => s + (p.geometry?.attributes?.position?.count ?? 0), 0);
    let sceneHtml = `Punkte: <b>${ptCount.toLocaleString('de-DE')}</b><br>B×H×T: <b>${size.x.toFixed(2)}×${size.y.toFixed(2)}×${size.z.toFixed(2)} m</b>`;
    if (scanCams.length > 0) {
      const metaStatus = rigAlignment
        ? `<span style="color:#7af">🗺 rig_kinematics</span>`
        : `<span style="color:#fa8">⚠ scan_metadata.json fehlt</span>`;
      sceneHtml += `<br>Scan-Kameras: <b>${scanCams.length}</b> · ${metaStatus}`;
    } else {
      sceneHtml += `<br><span style="color:#f76">⚠ Keine Frustums erkannt – neuen Scan durchführen</span>`;
    }
    infoScene.innerHTML = sceneHtml;
    document.getElementById('info-box').style.display = 'block';
    controlsEl.style.display = 'flex';

    overlay.classList.add('hidden');
    setTimeout(() => overlay.remove(), 700);
  },
  (xhr) => {
    if (xhr.total) {
      ovBar.style.width = Math.round(xhr.loaded/xhr.total*100)+'%';
      ovStatus.textContent = `Lade … ${Math.round(xhr.loaded/xhr.total*100)}%`;
    } else {
      ovStatus.textContent = `Lade … ${(xhr.loaded/1_048_576).toFixed(1)} MB`;
    }
  },
  (err) => { ovStatus.textContent = `Fehler: ${err.message}`; ovStatus.style.color = '#f66'; console.error(err); }
);

document.getElementById('btn-reset').addEventListener('click', () => flyTo(homePos.tgt, homePos.cam));

const ray   = new THREE.Raycaster();
ray.params.Points.threshold = 0.05;
const mouse = new THREE.Vector2();
let dsx = 0, dsy = 0;

renderer.domElement.addEventListener('mousedown', e => { dsx = e.clientX; dsy = e.clientY; });
renderer.domElement.addEventListener('click', e => {
  if ((e.clientX-dsx)**2 + (e.clientY-dsy)**2 > 25) return;
  mouse.x =  (e.clientX / innerWidth)  * 2 - 1;
  mouse.y = -(e.clientY / innerHeight) * 2 + 1;
  ray.setFromCamera(mouse, camera);

  const hits = ray.intersectObjects(allPoints, false);
  if (!hits.length) return;

  const pt = hits[0].point;
  flyTo(pt, null, true);
  ring(e.clientX, e.clientY, 'tgt');
  if (camWorldPos) displayPanTilt(pt);
});

function ring(cx, cy, type) {
  clickRing.style.left = cx+'px'; clickRing.style.top = cy+'px';
  clickRing.classList.remove('pulse','tgt','cal');
  void clickRing.offsetWidth;
  clickRing.classList.add('pulse', type);
}

const anim = {
  on:false, t:0, dur:0.75,
  fc:new THREE.Vector3(), ft:new THREE.Vector3(),
  tc:new THREE.Vector3(), tt:new THREE.Vector3(),
};
function flyTo(orbitTarget, exactCamPos=null, keepDist=false) {
  anim.fc.copy(camera.position); anim.ft.copy(orbitCtrl.target); anim.tt.copy(orbitTarget);
  if (exactCamPos) { anim.tc.copy(exactCamPos); }
  else if (keepDist) {
    const off = new THREE.Vector3().subVectors(camera.position, orbitCtrl.target);
    anim.tc.copy(orbitTarget).addScaledVector(off.normalize(), Math.min(off.length(), Math.max(.4, off.length()*.65)));
  } else { anim.tc.copy(camera.position); }
  anim.t = 0; anim.on = true;
}
function ease(t){ return t<.5 ? 4*t*t*t : 1-(-2*t+2)**3/2; }

const clock = new THREE.Clock();
(function tick(){
  requestAnimationFrame(tick);
  const dt = clock.getDelta();
  if (anim.on) {
    anim.t = Math.min(anim.t + dt / anim.dur, 1);
    const t = ease(anim.t);
    camera.position.lerpVectors(anim.fc, anim.tc, t);
    orbitCtrl.target.lerpVectors(anim.ft, anim.tt, t);
    if (anim.t >= 1) anim.on = false;
  }
  orbitCtrl.update();
  renderer.render(scene, camera);
})();

loadSettings();
refreshSendBtn();
</script>
</body>
